<div class="full-container" *ngIf="showDialog">
  <div class="dialog-container">
    <div class="sub-container">
      <div class="close">
        <button (click)="closeDialog()">&times;</button>
      </div>
      <div class="content-container">
        <div class="content">
          <img *ngIf="isImage(dialogData.document_url)" src="{{ dialogData.document_url }}" alt="document preview">
          <pdf-viewer *ngIf="!isImage(dialogData.document_url)" src="{{ dialogData.document_url }}" class="pdf"></pdf-viewer>
        </div>
      </div>
      <div class="btns">
        <button class="btn delete" (click)="deleteDocument()">
