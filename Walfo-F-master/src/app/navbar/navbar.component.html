<div class="container">
  <!-- Mobile Backdrop Overlay -->
  <div class="mobile-backdrop" *ngIf="showMenu" (click)="openMenu()"></div>

  <!-- Mobile Menu Floating Toggle -->
  <button class="mobile-toggle-btn" (click)="openMenu()" aria-label="Toggle navigation menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div class="navbar" [class.show]="showMenu">
    <div class="navbar-header-mobile">
      <span class="navbar-logo">Walfo</span>
      <button class="close-drawer-btn" (click)="openMenu()" aria-label="Close menu">✕</button>
    </div>
    <div class="menu">
      <div class="menu-container">
        <ul>
          <li class="nav-link" (click)="openMenu()" [routerLink]="'/dashboard'"  routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <mask id="mask0_133_298" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <rect width="24" height="24" fill="#D9D9D9" />
              </mask>
              <g mask="url(#mask0_133_298)">
                <path d="M6 19H9V13H15V19H18V10L12 5.5L6 10V19ZM4 21V9L12 3L20 9V21H13V15H11V21H4Z" fill="white"/>
              </g>
            </svg>
            <a>Dashboard</a>
          </li>
          <li class="nav-link" (click)="openMenu()" [routerLink]="'/mydocuments'"  routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8M14 2L20 8M14 2V8H20M16 13H8M16 17H8M10 9H8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <a>My documents</a>
          </li>
          <li class="nav-link" (click)="openMenu()" [routerLink]="'/upload'"  routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15M17 8L12 3M12 3L7 8M12 3V15" stroke="#FFFDFD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <a>Upload</a>
          </li>
          <li class="nav-link" (click)="openMenu()" [routerLink]="'/calculator'" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <mask id="mask0_133_292" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <rect width="24" height="24" fill="#D9D9D9" />
              </mask>
              <g mask="url(#mask0_133_292)">
                <path d="M3 11V3H11V11H3ZM3 21V13H11V21H3ZM13 11V3H21V11H13ZM13 21V13H21V21H13ZM5 9H9V5H5V9ZM15 9H19V5H15V9ZM15 19H19V15H15V19ZM5 19H9V15H5V19Z" fill="white"/>
              </g>
            </svg>
            <a>Calculator</a>
          </li>
        </ul>
      </div>

      <!-- Menu Divider -->
      <div class="menu-divider"></div>

      <ul class="logout">
        <li class="nav-link logout-item" (click)="doLogout()" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H12V5H5V19H12V21H5ZM16 17L14.625 15.55L17.175 13H9V11H17.175L14.625 8.45L16 7L21 12L16 17Z" fill="currentColor"/>
          </svg>
          <a>Logout</a>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- Logout Confirmation Modal -->
<div class="logout-overlay" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <div class="logout-modal" (click)="$event.stopPropagation()">
    <div class="logout-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H12V5H5V19H12V21H5ZM16 17L14.625 15.55L17.175 13H9V11H17.175L14.625 8.45L16 7L21 12L16 17Z" fill="#e74c3c"/>
      </svg>
    </div>
    <h3>Logout</h3>
    <p>Are you sure you want to logout?</p>
    <div class="logout-actions">
      <button class="btn-no" (click)="cancelLogout()">No, Stay</button>
      <button class="btn-yes" (click)="confirmLogout()">Yes, Logout</button>
    </div>
  </div>
</div>
