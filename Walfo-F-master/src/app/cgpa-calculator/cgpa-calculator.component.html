<div class="body-container">
  <div class="body-center">
      <div class="text-field">
        <div class="calculator-container">
          <h2>CGPA Calculator</h2>

          <div *ngFor="let subject of subjects; let i = index" class="subject-row">
            <input type="text" placeholder="Subject" [(ngModel)]="subject.name" />
            <input type="number" placeholder="Marks" [(ngModel)]="subject.marks" />
            <button class="delete-btn" (click)="removeSubject(i)" title="Remove subject">✕</button>
          </div>

          <div class="buttons">
            <button (click)="addSubject()">+ Add Subject</button>
            <button (click)="calculateCGPA()">Calculate</button>
          </div>

          <div *ngIf="cgpa !== null" class="result">
            <p>Your CGPA: <strong>{{ cgpa | number:'1.2-2' }}</strong></p>
          </div>
        </div>

      </div>
  </div>
</div>
